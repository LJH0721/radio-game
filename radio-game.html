<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>📻 超外差收音机 - 流程填空</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
    background: linear-gradient(145deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .game-wrap {
    width: 820px;
    max-width: 100%;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(20px);
    border-radius: 28px;
    padding: 30px 25px 35px;
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 30px 80px rgba(0,0,0,0.5);
    position: relative;
    overflow: hidden;
  }
  .game-wrap::before {
    content: '';
    position: absolute;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: radial-gradient(ellipse at 30% 20%, rgba(100,180,255,0.06) 0%, transparent 60%);
    pointer-events: none;
  }

  .header {
    text-align: center;
    padding-bottom: 22px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    position: relative;
    z-index: 1;
  }
  .header h1 {
    color: #fff;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 3px;
  }
  .header h1 .icon { font-size: 28px; }
  .header .sub {
    color: rgba(255,255,255,0.4);
    font-size: 13px;
    margin-top: 6px;
    letter-spacing: 2px;
  }
  .header .credit {
    color: rgba(255,255,255,0.2);
    font-size: 12px;
    margin-top: 4px;
    letter-spacing: 1px;
  }
  .header .credit .name {
    color: rgba(251,191,36,0.6);
    font-weight: 600;
  }
  .header .progress {
    margin-top: 12px;
    display: flex;
    justify-content: center;
    gap: 8px;
  }
  .header .progress .dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    transition: all 0.4s;
  }
  .header .progress .dot.done { background: #4ade80; box-shadow: 0 0 12px rgba(74,222,128,0.4); }
  .header .progress .dot.active { background: #fbbf24; box-shadow: 0 0 12px rgba(251,191,36,0.4); animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.3); } }

  /* ===== 流程图区域 ===== */
  .flow-area {
    position: relative;
    z-index: 1;
    padding: 30px 10px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .flow-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0;
    width: 100%;
    flex-wrap: wrap;
    margin-bottom: 0;
  }

  .flow-node {
    background: linear-gradient(135deg, rgba(30,60,100,0.6), rgba(20,40,80,0.6));
    border: 1.5px solid rgba(100,180,255,0.15);
    border-radius: 12px;
    padding: 12px 16px;
    min-width: 80px;
    text-align: center;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    position: relative;
    transition: all 0.35s;
  }
  .flow-node.given {
    background: linear-gradient(135deg, rgba(59,130,246,0.3), rgba(37,99,235,0.2));
    border-color: rgba(59,130,246,0.3);
  }
  .flow-node .label {
    display: block;
    font-size: 11px;
    color: rgba(255,255,255,0.35);
    font-weight: 400;
    margin-bottom: 4px;
  }

  /* 箭头连接线 */
  .flow-arrow {
    color: rgba(255,255,255,0.15);
    font-size: 20px;
    padding: 0 4px;
    flex-shrink: 0;
  }
  .flow-arrow.down { display: none; }

  /* 填空槽位 */
  .blank-slot {
    background: rgba(255,200,50,0.06);
    border: 2px dashed rgba(255,200,50,0.25);
    border-radius: 12px;
    min-width: 96px;
    min-height: 52px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 10px 14px;
    cursor: pointer;
    transition: all 0.3s;
    color: rgba(255,255,255,0.2);
    font-size: 14px;
    position: relative;
  }
  .blank-slot:hover { border-color: rgba(255,200,50,0.5); background: rgba(255,200,50,0.1); }
  .blank-slot.active {
    border-color: #fbbf24;
    background: rgba(251,191,36,0.12);
    box-shadow: 0 0 25px rgba(251,191,36,0.15);
    animation: glow 1.5s infinite;
  }
  @keyframes glow { 0%,100% { box-shadow: 0 0 15px rgba(251,191,36,0.1); } 50% { box-shadow: 0 0 30px rgba(251,191,36,0.25); } }
  .blank-slot.filled {
    border-style: solid;
    border-color: rgba(74,222,128,0.3);
    background: linear-gradient(135deg, rgba(74,222,128,0.12), rgba(34,197,94,0.08));
    color: #4ade80;
    cursor: default;
    animation: none;
    box-shadow: 0 0 15px rgba(74,222,128,0.1);
  }
  .blank-slot.wrong {
    border-color: #ef4444;
    background: rgba(239,68,68,0.1);
    animation: shake 0.4s;
  }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }
  .blank-slot .slot-num {
    position: absolute;
    top: -10px; right: -10px;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: rgba(251,191,36,0.2);
    border: 1.5px solid rgba(251,191,36,0.3);
    color: #fbbf24;
    font-size: 11px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .blank-slot.filled .slot-num { background: rgba(74,222,128,0.2); border-color: rgba(74,222,128,0.3); color: #4ade80; }

  /* 混频 + 高频振荡器 特殊布局 */
  .mixer-section {
    display: flex;
    align-items: center;
    gap: 0;
    position: relative;
  }
  .mixer-side {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .mixer-side .flow-arrow-side { color: rgba(255,255,255,0.15); font-size: 16px; transform: rotate(-90deg); }
  .mixer-side .blank-slot { min-width: 80px; }

  /* ===== 选项区域 ===== */
  .options-area {
    position: relative;
    z-index: 1;
    margin-top: 30px;
    padding-top: 24px;
    border-top: 1px solid rgba(255,255,255,0.06);
  }
  .options-title {
    color: rgba(255,255,255,0.3);
    font-size: 12px;
    letter-spacing: 3px;
    text-align: center;
    margin-bottom: 14px;
  }
  .options-grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
  }
  .option-chip {
    padding: 12px 22px;
    border-radius: 12px;
    border: 1.5px solid rgba(255,255,255,0.1);
    background: linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.03));
    color: rgba(255,255,255,0.7);
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.25s;
    user-select: none;
    position: relative;
    min-width: 80px;
    text-align: center;
  }
  .option-chip:hover {
    border-color: rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.1);
    transform: translateY(-2px);
  }
  .option-chip:active { transform: translateY(0); }
  .option-chip.selected {
    border-color: #fbbf24;
    background: rgba(251,191,36,0.15);
    color: #fbbf24;
    box-shadow: 0 0 20px rgba(251,191,36,0.15);
  }
  .option-chip.used {
    opacity: 0.2;
    pointer-events: none;
    transform: scale(0.95);
  }
  .option-chip .opt-num {
    display: inline-block;
    width: 22px; height: 22px;
    line-height: 22px;
    border-radius: 50%;
    background: rgba(255,255,255,0.06);
    font-size: 11px;
    margin-right: 8px;
    text-align: center;
    color: rgba(255,255,255,0.3);
  }

  /* ===== 提示栏 ===== */
  .hint-bar {
    text-align: center;
    margin-top: 18px;
    color: rgba(255,255,255,0.25);
    font-size: 13px;
    letter-spacing: 1px;
    min-height: 24px;
    transition: all 0.3s;
  }
  .hint-bar.success { color: #4ade80; }
  .hint-bar.error { color: #ef4444; }

  /* ===== 胜利弹窗 ===== */
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    backdrop-filter: blur(12px);
    z-index: 1000;
    justify-content: center;
    align-items: center;
  }
  .overlay.show { display: flex; }
  .modal {
    background: linear-gradient(145deg, rgba(20,30,60,0.98), rgba(15,25,50,0.98));
    border-radius: 28px;
    padding: 40px 50px;
    text-align: center;
    max-width: 440px;
    width: 90%;
    border: 1px solid rgba(255,255,255,0.1);
    animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    position: relative;
    overflow: hidden;
  }
  @keyframes popIn {
    from { transform: scale(0.5) rotate(-5deg); opacity: 0; }
    to { transform: scale(1) rotate(0); opacity: 1; }
  }
  .modal .trophy { font-size: 72px; margin-bottom: 8px; display: block; }
  .modal h2 { color: #ffd700; font-size: 32px; margin-bottom: 4px; letter-spacing: 4px; }
  .modal .sub { color: rgba(255,255,255,0.5); font-size: 15px; margin-bottom: 6px; }
  .modal .detail { color: rgba(255,255,255,0.35); font-size: 13px; margin-bottom: 24px; }
  .btn {
    padding: 16px 48px;
    border: none;
    border-radius: 14px;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.25s;
    font-family: inherit;
    letter-spacing: 2px;
  }
  .btn-primary {
    background: linear-gradient(135deg, #f59e0b, #d97706);
    color: #fff;
    box-shadow: 0 6px 25px rgba(245,158,11,0.3);
  }
  .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 8px 35px rgba(245,158,11,0.4); }

  /* ===== 五彩纸屑 ===== */
  .confetti-container {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1001;
    overflow: hidden;
  }
  .confetti {
    position: absolute;
    width: 10px; height: 10px;
    top: -20px;
    animation: confettiFall linear forwards;
  }
  @keyframes confettiFall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }

  /* ===== 响应式 ===== */
  @media (max-width: 600px) {
    .game-wrap { padding: 20px 14px; }
    .header h1 { font-size: 18px; }
    .flow-node { padding: 8px 10px; min-width: 56px; font-size: 12px; }
    .blank-slot { min-width: 64px; min-height: 40px; padding: 8px 10px; font-size: 12px; }
    .flow-arrow { font-size: 14px; padding: 0 2px; }
    .option-chip { padding: 10px 14px; font-size: 13px; min-width: 60px; }
    .modal { padding: 30px 24px; }
    .modal .trophy { font-size: 52px; }
    .modal h2 { font-size: 24px; }
  }

  /* ===== 音效按钮 ===== */
  .sound-toggle {
    position: absolute;
    top: 16px; right: 20px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 6px 12px;
    color: rgba(255,255,255,0.4);
    font-size: 18px;
    cursor: pointer;
    transition: all 0.2s;
    z-index: 2;
  }
  .sound-toggle:hover { background: rgba(255,255,255,0.1); color: #fff; }
</style>
</head>
<body>

<div class="game-wrap">
  <button class="sound-toggle" id="soundToggle" title="音效开关">🔊</button>

  <div class="header">
    <h1><span class="icon">📻</span> 超外差调幅收音机流程</h1>
    <div class="sub">将正确的流程名称填入对应空位中</div>
    <div class="credit">制作者：<span class="name">李俊辉</span></div>
    <div class="progress" id="progressDots"></div>
  </div>

  <div class="flow-area" id="flowArea">
    <!-- 流程图由 JS 动态生成 -->
  </div>

  <div class="options-area">
    <div class="options-title">— 选择答案 —</div>
    <div class="options-grid" id="optionsGrid"></div>
  </div>

  <div class="hint-bar" id="hintBar">💡 点击一个空位，再点击下方对应的答案填入</div>
</div>

<!-- 胜利弹窗 -->
<div class="overlay" id="winOverlay">
  <div class="modal">
    <span class="trophy">🏆</span>
    <h2>全部正确！</h2>
    <div class="sub">🎉 李俊辉 已掌握超外差收音机流程</div>
    <div class="detail" id="resultDetail">用时 0 秒 · 错误 0 次</div>
    <button class="btn btn-primary" id="restartBtn">🔄 再来一次</button>
  </div>
</div>
<div class="confetti-container" id="confettiContainer"></div>

<script>
// ============ 游戏数据 ============
const BLANKS = [
  { id: 'hf_amp',    label: '①', answer: '高频小放',   hint: '高频小信号放大器' },
  { id: 'mixer',     label: '②', answer: '混频',        hint: '混频器' },
  { id: 'lo',        label: '③', answer: '高频振荡器',  hint: '本机振荡器' },
  { id: 'if_amp',    label: '④', answer: '中放',        hint: '中频放大器' },
  { id: 'detect',    label: '⑤', answer: '检波',        hint: '检波器' },
  { id: 'lf_amp',    label: '⑥', answer: '低放',        hint: '低频放大器' },
];

// 混频和高频振荡器是特殊位置（混频在主流程，高频振荡器从旁接入）
const FLOW_NODES = [
  { type: 'given',  text: '天线',   id: 'antenna' },
  { type: 'arrow',  text: '→' },
  { type: 'blank',  ref: 'hf_amp'  },
  { type: 'arrow',  text: '→' },
  { type: 'mixed',  ref: 'mixer',  loRef: 'lo'  },  // 混频 + 高频振荡器旁支
  { type: 'arrow',  text: '→' },
  { type: 'blank',  ref: 'if_amp'  },
  { type: 'arrow',  text: '→' },
  { type: 'blank',  ref: 'detect'  },
  { type: 'arrow',  text: '→' },
  { type: 'blank',  ref: 'lf_amp'  },
  { type: 'arrow',  text: '→' },
  { type: 'given',  text: '扬声器', id: 'speaker' },
];

// ============ 游戏状态 ============
let state = {
  filled: {},        // { blankId: answerString }
  activeSlot: null,  // 当前选中的空位 id
  errors: 0,
  startTime: null,
  soundOn: true,
};

// ============ 音效 (Web Audio API) ============
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playTone(freq, duration, type = 'sine', vol = 0.12) {
  if (!state.soundOn) return;
  try {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + duration);
  } catch(e) {}
}

function playCorrect() {
  playTone(523, 0.15, 'sine', 0.1);
  setTimeout(() => playTone(659, 0.15, 'sine', 0.1), 100);
  setTimeout(() => playTone(784, 0.2, 'sine', 0.1), 200);
}

function playWrong() {
  playTone(200, 0.25, 'sawtooth', 0.06);
}

function playVictory() {
  const notes = [523, 587, 659, 784, 880, 1047];
  notes.forEach((n, i) => {
    setTimeout(() => playTone(n, 0.3, 'sine', 0.08), i * 120);
  });
}

// ============ 界面构建 ============
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildFlow() {
  const area = document.getElementById('flowArea');
  area.innerHTML = '';

  const container = document.createElement('div');
  container.style.cssText = 'display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px;';

  for (const node of FLOW_NODES) {
    if (node.type === 'given') {
      const el = document.createElement('div');
      el.className = 'flow-node given';
      el.textContent = node.text;
      el.style.minWidth = '60px';
      container.appendChild(el);
    } else if (node.type === 'arrow') {
      const el = document.createElement('div');
      el.className = 'flow-arrow';
      el.textContent = '→';
      container.appendChild(el);
    } else if (node.type === 'blank') {
      const blank = BLANKS.find(b => b.id === node.ref);
      const el = document.createElement('div');
      el.className = 'blank-slot';
      el.dataset.blankId = blank.id;
      el.innerHTML = `<span class="slot-num">${blank.label.replace(/[①②③④⑤⑥]/g, m => '①②③④⑤⑥'.indexOf(m)+1)}</span><span class="slot-text">?</span>`;
      el.addEventListener('click', () => onSlotClick(blank.id));
      container.appendChild(el);
    } else if (node.type === 'mixed') {
      // 主流程：混频
      const blank = BLANKS.find(b => b.id === node.ref);
      const loBlank = BLANKS.find(b => b.id === node.loRef);

      const wrapper = document.createElement('div');
      wrapper.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:4px;';

      // 上方：高频振荡器 (旁支)
      const loRow = document.createElement('div');
      loRow.style.cssText = 'display:flex;align-items:center;gap:4px;';
      const loSlot = document.createElement('div');
      loSlot.className = 'blank-slot';
      loSlot.dataset.blankId = loBlank.id;
      loSlot.style.minWidth = '72px';
      loSlot.style.minHeight = '40px';
      loSlot.innerHTML = `<span class="slot-num">3</span><span class="slot-text">?</span>`;
      loSlot.addEventListener('click', () => onSlotClick(loBlank.id));
      loRow.appendChild(loSlot);
      const downArrow = document.createElement('div');
      downArrow.style.cssText = 'color:rgba(255,255,255,0.15);font-size:14px;';
      downArrow.textContent = '↓';
      loRow.appendChild(downArrow);
      wrapper.appendChild(loRow);

      // 下方：混频
      const mixRow = document.createElement('div');
      mixRow.style.cssText = 'display:flex;align-items:center;gap:4px;';
      // 左箭头 (从高频小放来)
      const leftArr = document.createElement('div');
      leftArr.className = 'flow-arrow';
      leftArr.textContent = '→';
      leftArr.style.fontSize = '16px';
      // 混频槽
      const mixSlot = document.createElement('div');
      mixSlot.className = 'blank-slot';
      mixSlot.dataset.blankId = blank.id;
      mixSlot.innerHTML = `<span class="slot-num">2</span><span class="slot-text">?</span>`;
      mixSlot.addEventListener('click', () => onSlotClick(blank.id));
      // 右箭头
      const rightArr = document.createElement('div');
      rightArr.className = 'flow-arrow';
      rightArr.textContent = '→';
      rightArr.style.fontSize = '16px';

      mixRow.appendChild(leftArr);
      mixRow.appendChild(mixSlot);
      mixRow.appendChild(rightArr);
      wrapper.appendChild(mixRow);

      container.appendChild(wrapper);
    }
  }

  area.appendChild(container);
}

function buildOptions() {
  const grid = document.getElementById('optionsGrid');
  grid.innerHTML = '';
  const shuffled = shuffle(BLANKS.map(b => b.answer));
  for (const ans of shuffled) {
    const chip = document.createElement('div');
    chip.className = 'option-chip';
    chip.dataset.answer = ans;
    chip.textContent = ans;
    chip.addEventListener('click', () => onOptionClick(ans));
    grid.appendChild(chip);
  }
}

function buildProgress() {
  const dots = document.getElementById('progressDots');
  dots.innerHTML = '';
  for (const blank of BLANKS) {
    const dot = document.createElement('div');
    dot.className = 'dot';
    dot.dataset.blankId = blank.id;
    dots.appendChild(dot);
  }
}

// ============ 交互逻辑 ============
function onSlotClick(blankId) {
  const blank = BLANKS.find(b => b.id === blankId);
  if (state.filled[blankId]) return; // 已填入

  // 取消之前的高亮
  document.querySelectorAll('.blank-slot.active').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.option-chip.selected').forEach(el => el.classList.remove('selected'));

  state.activeSlot = blankId;
  const slotEl = document.querySelector(`.blank-slot[data-blank-id="${blankId}"]`);
  if (slotEl) slotEl.classList.add('active');

  document.getElementById('hintBar').textContent = `💡 请选择「${blank.hint}」的答案`;
}

function onOptionClick(answer) {
  if (!state.activeSlot) {
    document.getElementById('hintBar').textContent = '👆 请先点击一个空位';
    return;
  }

  const blankId = state.activeSlot;
  const blank = BLANKS.find(b => b.id === blankId);
  const slotEl = document.querySelector(`.blank-slot[data-blank-id="${blankId}"]`);

  if (!slotEl || state.filled[blankId]) return;

  // 检查答案
  if (answer === blank.answer) {
    // 正确
    state.filled[blankId] = answer;
    slotEl.classList.remove('active');
    slotEl.classList.add('filled');
    const textEl = slotEl.querySelector('.slot-text');
    if (textEl) textEl.textContent = answer;

    // 标记选项已用
    document.querySelectorAll(`.option-chip[data-answer="${answer}"]`).forEach(el => {
      el.classList.add('used');
    });

    // 更新进度点
    const dot = document.querySelector(`.progress .dot[data-blank-id="${blankId}"]`);
    if (dot) { dot.classList.remove('active'); dot.classList.add('done'); }

    // 音效
    playCorrect();

    // 提示
    document.getElementById('hintBar').textContent = `✅ 正确！「${blank.hint}」→ ${answer}`;
    document.getElementById('hintBar').className = 'hint-bar success';

    // 清除选中状态
    state.activeSlot = null;
    document.querySelectorAll('.option-chip.selected').forEach(el => el.classList.remove('selected'));

    // 检查是否全部完成
    checkComplete();

  } else {
    // 错误
    state.errors++;
    playWrong();
    slotEl.classList.add('wrong');
    document.getElementById('hintBar').textContent = `❌ 不对哦，再想想「${blank.hint}」是什么？`;
    document.getElementById('hintBar').className = 'hint-bar error';
    setTimeout(() => {
      slotEl.classList.remove('wrong');
    }, 500);
  }
}

function checkComplete() {
  const allFilled = BLANKS.every(b => state.filled[b.id]);
  if (allFilled) {
    const elapsed = Math.floor((Date.now() - state.startTime) / 1000);
    const min = Math.floor(elapsed / 60);
    const sec = elapsed % 60;
    document.getElementById('resultDetail').textContent =
      `用时 ${min > 0 ? min + '分' : ''}${sec}秒 · 错误 ${state.errors} 次`;

    playVictory();
    setTimeout(() => {
      document.getElementById('winOverlay').classList.add('show');
      launchConfetti();
    }, 400);
  }
}

// ============ 五彩纸屑 ============
function launchConfetti() {
  const container = document.getElementById('confettiContainer');
  container.innerHTML = '';
  const colors = ['#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#ff6bff','#ff9f43','#00d2d3','#a29bfe'];
  for (let i = 0; i < 120; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    const color = colors[Math.floor(Math.random() * colors.length)];
    const size = 6 + Math.random() * 10;
    const left = Math.random() * 100;
    const delay = Math.random() * 2;
    const duration = 2 + Math.random() * 3;
    const shape = Math.random() > 0.5 ? '50%' : '2px';
    c.style.cssText = `
      left:${left}%;
      width:${size}px;height:${size}px;
      background:${color};
      border-radius:${shape};
      animation-delay:${delay}s;
      animation-duration:${duration}s;
    `;
    container.appendChild(c);
  }
  // 清理
  setTimeout(() => { container.innerHTML = ''; }, 5000);
}

// ============ 重置 ============
function resetGame() {
  state.filled = {};
  state.activeSlot = null;
  state.errors = 0;
  state.startTime = Date.now();
  document.getElementById('winOverlay').classList.remove('show');
  document.getElementById('hintBar').textContent = '💡 点击一个空位，再点击下方对应的答案填入';
  document.getElementById('hintBar').className = 'hint-bar';
  document.getElementById('confettiContainer').innerHTML = '';

  // 清除选中状态
  document.querySelectorAll('.option-chip.selected').forEach(el => el.classList.remove('selected'));

  // 重新构建（随机化选项）
  buildFlow();
  buildOptions();
  buildProgress();

  // 更新进度 - 第一个空位高亮
  setTimeout(() => {
    const firstBlank = BLANKS.find(b => !state.filled[b.id]);
    if (firstBlank) {
      const dot = document.querySelector(`.progress .dot[data-blank-id="${firstBlank.id}"]`);
      if (dot) dot.classList.add('active');
    }
  }, 100);
}

// ============ 音效开关 ============
document.getElementById('soundToggle').addEventListener('click', () => {
  state.soundOn = !state.soundOn;
  document.getElementById('soundToggle').textContent = state.soundOn ? '🔊' : '🔇';
});

// ============ 重新开始按钮 ============
document.getElementById('restartBtn').addEventListener('click', resetGame);

// ============ 启动 ============
resetGame();
</script>
</body>
