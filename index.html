<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>李俊辉 - 互动学习网页</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
    background: linear-gradient(145deg, #0a0e1a, #1a1f3a);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .card {
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(20px);
    border-radius: 24px;
    padding: 40px 50px;
    border: 1px solid rgba(255,255,255,0.08);
    text-align: center;
    max-width: 500px;
    width: 100%;
    box-shadow: 0 30px 80px rgba(0,0,0,0.5);
  }
  h1 { color: #fff; font-size: 26px; margin-bottom: 6px; letter-spacing: 3px; }
  .sub { color: rgba(255,255,255,0.3); font-size: 14px; margin-bottom: 30px; }
  .links { display: flex; flex-direction: column; gap: 14px; }
  .link-btn {
    display: flex; align-items: center; justify-content: center;
    gap: 10px; padding: 18px 24px;
    border-radius: 14px;
    text-decoration: none;
    color: #fff;
    font-size: 17px;
    font-weight: 600;
    transition: all 0.25s;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .link-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 30px rgba(0,0,0,0.3);
  }
  .link-btn.radio {
    background: linear-gradient(135deg, rgba(100,180,255,0.15), rgba(59,130,246,0.1));
    border-color: rgba(100,180,255,0.2);
  }
  .link-btn.radio:hover { background: linear-gradient(135deg, rgba(100,180,255,0.25), rgba(59,130,246,0.15)); }
  .link-btn.resonance {
    background: linear-gradient(135deg, rgba(251,191,36,0.15), rgba(245,158,11,0.1));
    border-color: rgba(251,191,36,0.2);
  }
  .link-btn.resonance:hover { background: linear-gradient(135deg, rgba(251,191,36,0.25), rgba(245,158,11,0.15)); }
  .link-btn .icon { font-size: 28px; }
  .link-btn .desc { display: block; font-size: 12px; font-weight: 400; color: rgba(255,255,255,0.3); margin-top: 2px; }
  .footer { margin-top: 28px; color: rgba(255,255,255,0.15); font-size: 12px; letter-spacing: 1px; }
</style>
</head>
<body>
  <div class="card">
    <h1>🎓 互动学习</h1>
    <div class="sub">制作者：李俊辉</div>
    <div class="links">
      <a href="index.html" class="link-btn radio">
        <span class="icon">📻</span>
        <span>超外差收音机流程填空<span class="desc">将收音机关键流程填入对应空位</span></span>
      </a>
      <a href="resonance.html" class="link-btn resonance">
        <span class="icon">⚡</span>
        <span>串联谐振回路仿真<span class="desc">调节参数理解 Q 与通频带 B 的关系</span></span>
      </a>
    </div>
    <div class="footer">LJH0721 · GitHub Pages</div>
  </div>
</body>
</html>
